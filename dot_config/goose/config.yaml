GOOSE_MODEL: claude-sonnet-4-20250514
GOOSE_PROVIDER: anthropic
extensions:
  computer-controller:
    enabled: true
    name: computercontroller
    timeout: 300
    type: builtin
  developer:
    enabled: true
    name: developer
    timeout: 300
    type: builtin
  fetch:
    args:
    - mcp-server-fetch
    cmd: uvx
    enabled: true
    name: fetch
    timeout: 300
    type: stdio
  github:
    args:
    - run
    - --allow-net
    - npm:@modelcontextprotocol/server-github
    cmd: deno
    enabled: true
    envs:
      GITHUB_PERSONAL_ACCESS_TOKEN: $GITHUB_TOKEN
    name: github
    timeout: 300
    type: stdio
  knowledge-graph-memory:
    args:
    - run
    - npm:@modelcontextprotocol/server-memory
    cmd: deno
    enabled: true
    envs: {}
    name: knowledge-graph-memory
    timeout: 300
    type: stdio
  memory:
    enabled: true
    name: memory
    timeout: 300
    type: builtin
  sequential-thinking:
    args:
    - run
    - --allow-env
    - npm:@modelcontextprotocol/server-sequential-thinking
    cmd: deno
    enabled: true
    envs: {}
    name: sequential-thinking
    timeout: 300
    type: stdio
OPENAI_BASE_PATH: v1/chat/completions
GOOSE_CLI_MIN_PRIORITY: 0.0
GOOSE_MODE: auto
OPENAI_HOST: https://api.openai.com

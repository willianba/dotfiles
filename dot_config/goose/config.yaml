GOOSE_CLI_MIN_PRIORITY: 0.0
extensions:
  computer-controller:
    enabled: true
    name: computercontroller
    timeout: 300
    type: builtin
  developer:
    enabled: true
    name: developer
    timeout: 300
    type: builtin
  knowledge-graph-memory:
    args:
    - run
    - 'npm:@modelcontextprotocol/server-memory'
    cmd: deno
    enabled: true
    envs: {}
    name: knowledge-graph-memory
    timeout: 300
    type: stdio
  memory:
    enabled: true
    name: memory
    timeout: 300
    type: builtin
  sequential-thinking:
    args:
    - run
    - 'npm:@modelcontextprotocol/server-sequential-thinking'
    cmd: deno
    enabled: true
    envs: {}
    name: sequential-thinking
    timeout: 300
    type: stdio
OPENAI_BASE_PATH: v1/chat/completions
OPENAI_HOST: https://api.openai.com
GOOSE_PROVIDER: openai
GOOSE_MODE: approve
GOOSE_MODEL: gpt-4o
